<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conake Browser Collaboration Portal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="45%" stop-color="#13072a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7c3aed" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <style>
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .float { animation: float 5s ease-in-out infinite; }
      .scan { animation: scan 6s linear infinite; }
      .blink { animation: blink 1.4s steps(2,end) infinite; }
      .dash { stroke-dasharray: 16 20; animation: dash 5s linear infinite; }
      .spark { animation: spark 3.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      @keyframes scan { 0%{transform:translateY(-80px);opacity:0} 12%{opacity:.35} 88%{opacity:.35} 100%{transform:translateY(600px);opacity:0} }
      @keyframes blink { 0%,45%{opacity:1} 46%,100%{opacity:.18} }
      @keyframes dash { to { stroke-dashoffset:-180; } }
      @keyframes spark { 0%,100%{opacity:.15;transform:scale(.8)} 50%{opacity:1;transform:scale(1.3)} }
      text { font-family: Inter,Segoe UI,Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="28" fill="url(#grid)"/>

  <circle cx="1100" cy="210" r="165" fill="#7c3aed" opacity=".18" filter="url(#softGlow)" class="pulse"/>
  <circle cx="1110" cy="200" r="112" fill="url(#moon)" opacity=".92" filter="url(#glow)" class="float"/>
  <circle cx="1070" cy="165" r="17" fill="#6d28d9" opacity=".35"/>
  <circle cx="1146" cy="238" r="28" fill="#6d28d9" opacity=".25"/>
  <circle cx="1094" cy="255" r="13" fill="#6d28d9" opacity=".26"/>

  <path d="M0 414 C220 340 390 390 575 340 C730 300 812 245 945 260 C1120 280 1220 380 1400 334 V520 H0 Z" fill="#09051d" opacity=".92"/>
  <path d="M0 438 C255 360 410 410 590 360 C760 314 900 286 1042 315 C1180 343 1265 406 1400 370" fill="none" stroke="#22d3ee" stroke-opacity=".33" stroke-width="2" class="dash"/>

  <g opacity=".82">
    <path d="M1040 365 C1090 320 1140 316 1190 345 C1230 368 1260 395 1298 420" fill="none" stroke="url(#neon)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M1298 420 C1270 425 1246 430 1223 446" fill="none" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="1037" cy="366" r="18" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="1031" cy="361" r="4" fill="white"/>
  </g>

  <g opacity=".9">
    <path d="M905 62 L1350 62" stroke="url(#neon)" stroke-width="2"/>
    <path d="M930 76 L1325 76" stroke="#22d3ee" stroke-opacity=".25" stroke-width="1"/>
    <text x="905" y="48" font-size="14" fill="#94a3b8" letter-spacing="4">CONAKE // SIGNAL CHANNEL 01</text>
  </g>

  <g class="float">
    <rect x="70" y="72" width="655" height="326" rx="22" fill="#070510" fill-opacity=".72" stroke="#8b5cf6" stroke-opacity=".55"/>
    <rect x="90" y="94" width="615" height="6" rx="3" fill="url(#neon)" opacity=".9"/>
    <circle cx="112" cy="124" r="5" fill="#f43f5e"/>
    <circle cx="132" cy="124" r="5" fill="#f59e0b"/>
    <circle cx="152" cy="124" r="5" fill="#22d3ee"/>

    <text x="96" y="182" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="2">CONAKE</text>
    <text x="96" y="234" font-size="43" font-weight="800" fill="url(#neon)" letter-spacing="3">BROWSER</text>
    <text x="98" y="276" font-size="16" fill="#cbd5e1" letter-spacing="6">COLLABORATION PORTAL</text>

    <rect x="98" y="309" width="190" height="42" rx="21" fill="#7c3aed" fill-opacity=".2" stroke="#a855f7"/>
    <circle cx="120" cy="330" r="6" fill="#22c55e" class="blink"/>
    <text x="136" y="336" font-size="15" fill="#ffffff" font-weight="700">SYSTEM ONLINE</text>

    <text x="318" y="335" font-size="14" fill="#94a3b8">Chromium Core // Conake Soul</text>
  </g>

  <g opacity=".9">
    <rect x="770" y="322" width="390" height="112" rx="18" fill="#08051a" fill-opacity=".76" stroke="#22d3ee" stroke-opacity=".35"/>
    <text x="792" y="352" font-size="13" fill="#22d3ee" letter-spacing="3">MISSION OBJECTIVE</text>
    <text x="792" y="382" font-size="18" fill="#f8fafc" font-weight="800">BUILD • TEST • EVOLVE</text>
    <text x="792" y="408" font-size="13" fill="#94a3b8">Independent. Experimental. Community-shaped.</text>
  </g>

  <g fill="#ffffff">
    <circle cx="820" cy="96" r="2.5" class="spark"/>
    <circle cx="860" cy="128" r="1.8" class="spark" style="animation-delay:.5s"/>
    <circle cx="1265" cy="126" r="2.6" class="spark" style="animation-delay:1.1s"/>
    <circle cx="1332" cy="208" r="1.8" class="spark" style="animation-delay:1.8s"/>
    <circle cx="885" cy="246" r="2.2" class="spark" style="animation-delay:2.2s"/>
  </g>

  <rect x="0" y="-70" width="1400" height="70" fill="url(#neon)" opacity=".08" class="scan"/>
</svg>